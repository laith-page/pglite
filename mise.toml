[tools]
bun = "1.4.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.check]
description = "Validate workflow syntax, shell commands and static own-runner routing"
run = ["actionlint -no-color", "bun .ci/l3-routing.ts ."]

[tasks.setup-hooks]
description = "Enable the repository hooks before pushing"
run = "git config core.hooksPath .husky"
